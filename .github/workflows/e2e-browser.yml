name: End-to-end browser-based tests

on:
  push:
    # Every change to main has already been tested in the merge queue
    # (gh-readonly-queue/main/* branches).
    branches-ignore:
      - main

env:
  CI: true
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e-browser:
    runs-on: ubuntu-latest
    environment:
      name: ${{ matrix.environment-name }}
    # Do not interrupt the tests on one failure, as they are quite flaky.
    continue-on-error: true
    strategy:
      fail-fast: true
      matrix:
        environment-name: ["ESS PodSpaces"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps
      - # Dependabot cannot access secrets, so it doesn't have a token to authenticate to ESS.
        # We want jobs in this workflow to be gating PRs, so the whole matrix must
        # run even for dependabot so that the matrixed jobs are skipped, instead
        # of the whole pipeline.
        # Dev dependency bumps from dependabot are also skipped in the merge queue
        # (where the head commit is the squashed dependabot commit): they do not
        # change the library's runtime dependencies (build tooling changes are
        # still covered by unit tests), and running e2e tests for each of them
        # issues a large volume of VCs against the test accounts.
        if: >-
          github.actor != 'dependabot[bot]' &&
          !(
            github.event.head_commit.author.name == 'dependabot[bot]' &&
            startsWith(github.event.head_commit.message, 'Chore(deps-dev)')
          )
        run: npm run test:e2e:browser
        env:
          E2E_TEST_USER: ${{ secrets.E2E_TEST_USER }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          E2E_TEST_IDP: ${{ secrets.E2E_TEST_IDP }}
          # These secrets are used for test setup in fixture.ts
          E2E_TEST_OWNER_CLIENT_ID: ${{ secrets.E2E_TEST_OWNER_CLIENT_ID }}
          E2E_TEST_OWNER_CLIENT_SECRET: ${{ secrets.E2E_TEST_OWNER_CLIENT_SECRET }}
          E2E_TEST_REQUESTOR_CLIENT_ID: ${{ secrets.E2E_TEST_REQUESTOR_CLIENT_ID }}
          E2E_TEST_REQUESTOR_CLIENT_SECRET: ${{ secrets.E2E_TEST_REQUESTOR_CLIENT_SECRET }}
          E2E_TEST_VC_PROVIDER: ${{ secrets.E2E_TEST_VC_PROVIDER }}
          E2E_TEST_ENVIRONMENT: ${{ matrix.environment-name }}
      - name: Archive browser-based end-to-end test request logs
        uses: actions/upload-artifact@v7
        if: failure()
        continue-on-error: true
        with:
          name: playwright-output
          path: test-results/
      - name: Archive production artifacts
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: dist
          path: dist
